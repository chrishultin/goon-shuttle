  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;background:#08080e;-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:7px;height:7px;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    a{color:#25e6ff;text-decoration:none;} a:hover{color:#7ff0ff;}
    button{font-family:inherit;}
    input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.16);outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#25e6ff;box-shadow:0 0 12px rgba(37,230,255,.9);cursor:pointer;}
    input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:#25e6ff;box-shadow:0 0 12px rgba(37,230,255,.9);cursor:pointer;}
    @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
    @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  /* ============================================================================
   *  CONFIG  —  EDIT YOUR SCHEDULE HERE
   *  ---------------------------------------------------------------------------
   *  This whole block is the only thing you normally touch. Change the days and
   *  the `schedule`, reload the page, done. No build step, no tooling.
   *
   *  SCHEDULE FORMAT — frequency blocks, not a list of every departure:
   *
   *      [ "07:00", "10:00", 30 ]        ->  a shuttle every 30 min, 07:00-10:00
   *      [ "09:00", "19:00", 12, 6 ]     ->  every 12 min, 09:00-19:00, but the
   *                                          first one leaves 6 min in (a "phase"
   *                                          offset so the return leg doesn't
   *                                          depart the same minute as the outbound)
   *
   *  Each [from, to, every, phase?] = [start "HH:MM", end "HH:MM",
   *  minutes-between-departures, optional-offset-minutes]. The end time is
   *  exclusive. List as many blocks per direction as you need (rush hour, etc.).
   * ========================================================================== */
  const CONFIG = {

    // IANA timezone the clock + "next departure" are computed in.
    timezone: 'America/Los_Angeles',

    branding: {
      title:    'DEF CON // SHUTTLE',
      subtitle: 'RIO ⇄ LVCC · LAS VEGAS · PT · GOONS ONLY',
      left:     'RIO',        // left endpoint label (shown in the schematic)
      right:    'LVCC',       // right endpoint label
      tzLabel:  'Las Vegas',  // used in the footer: "shown in <tzLabel> time"
    },

    // The two travel directions. r2l = left->right endpoint, l2r = right->left.
    // color = primary neon; tint = lighter shade used for the "in 12 min" text.
    directions: {
      r2l: { label: 'Rio → LVCC', badge: 'R→L', color: '#ff2f86', tint: '#ff8fc0' },
      l2r: { label: 'LVCC → Rio', badge: 'L→R', color: '#25e6ff', tint: '#8fe9ff' },
    },

    // Event days (in the timezone above). `iso` is used to auto-select "today".
    days: [
      { key: 'wed', label: 'WED', date: 'AUG 5', iso: '2026-08-05' },
      { key: 'thu', label: 'THU', date: 'AUG 6', iso: '2026-08-06' },
      { key: 'fri', label: 'FRI', date: 'AUG 7', iso: '2026-08-07' },
      { key: 'sat', label: 'SAT', date: 'AUG 8', iso: '2026-08-08' },
      { key: 'sun', label: 'SUN', date: 'AUG 9', iso: '2026-08-09' },
    ],

    // Schedule per day.key -> per direction -> list of [from, to, every, phase?].
    schedule: {
      wed: {
        l2r: [
                ['12:00', '15:00', 60],
        ],
        r2l: [
                ['12:30', '15:30', 60]
        ]
      },
      thu: {
        l2r: [
                ['2:00', '5:00', 60],
                ['6:00', '8:30', 30],
                ['12:00', '21:00', 60]
        ],
        r2l: [
                ['2:30', '5:30', 60],
                ['6:30', '8:30', 30],
                ['12:30', '21:30', 60]
        ]
      },
      fri: {
        l2r: [
                ['2:00', '5:00', 60],
                ['6:00', '9:30', 30],
                ['12:00', '17:00', 60],
                ['17:30', '20:30', 30],
                ['21:00', '24:00', 60]
        ],
        r2l: [
                ['2:30', '5:30', 60],
                ['6:30', '10:00', 30],
                ['12:30', '17:30', 60],
                ['18:00', '21:00', 30],
                ['21:30', '24:00', 60]
        ]
      }
    },

    // Look + behavior knobs.
    theme: {
      bg:     '#08080e',   // page background
      text:   '#e9e9f5',   // primary text
      brand:  '#ff2f86',   // title glow
      accent: '#25e6ff',   // selected day tab + blinking cursor
    },
    display: {
      feedCount:        10,    // upcoming departures listed per column (Upcoming view only)
      showSchematic:    true,  // the little RIO <-> LVCC diagram under the header
      showFullSchedule: false, // default the board to the whole day instead of just upcoming
      showSimClock:     false, // dev-only "time travel" slider - set true to test other times
    },
  };

  /* ============================================================================
   *  ENGINE  —  you shouldn't need to edit below this line.
   * ========================================================================== */
  const MON = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const pad = n => String(n).padStart(2,'0');
  const p2m = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };            // "HH:MM" -> minutes-since-midnight
  const m2t = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;                            // minutes -> "HH:MM"
  const hexToRgba = (hex,a) => { const n = parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

  // Normalize a day/direction's [from,to,every,phase?] blocks into objects.
  const blocks = (dayKey,dirKey) => (CONFIG.schedule[dayKey]?.[dirKey] || [])
    .map(b => ({ from:b[0], to:b[1], every:b[2], phase:b[3] || 0 }));

  // Expand frequency blocks into concrete departure minutes, sorted.
  function expand(bs){
    const out = [];
    bs.forEach(b => { const s = p2m(b.from)+(b.phase||0), e = p2m(b.to); for(let t=s;t<e;t+=b.every) out.push(t); });
    return out.sort((a,b)=>a-b);
  }

  // Human relative time for a departure `diff` minutes from now.
  function rel(diff){
    if(diff === 0) return 'boarding';
    if(diff < 0)  return 'departed';
    if(diff < 60) return `in ${diff} min`;
    return `in ${Math.floor(diff/60)}h ${pad(diff%60)}m`;
  }

  // Current wall-clock time in CONFIG.timezone.
  function tzNow(){
    const parts = new Intl.DateTimeFormat('en-US',{ timeZone:CONFIG.timezone, hour12:false, weekday:'short', month:'short', day:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(new Date());
    const g = t => { const p = parts.find(x=>x.type===t); return p ? p.value : ''; };
    const hour = (+g('hour'))%24, minute = +g('minute');
    return { hour, minute, iso:`${g('year')}-${MON[g('month')]||'01'}-${g('day')}`, min:hour*60+minute };
  }

  // CSS for one row in the upcoming feed, depending on its status.
  function depStyle(meta,{isNext,isPast,isSoon}){
    const base = "display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-radius:8px;margin-bottom:3px;font:700 14px 'Space Mono';";
    if(isNext) return base + `color:#fff;background:linear-gradient(90deg, ${meta.soft}, transparent);border-left:3px solid ${meta.color};box-shadow:inset 0 0 0 1px ${meta.soft};`;
    if(isPast) return base + "color:#42425c;border-left:3px solid transparent;";
    if(isSoon) return base + `color:#e9e9f5;border-left:3px solid ${meta.color};`;
    return base + "color:#9a9ab4;border-left:3px solid transparent;";
  }

  // Everything the UI needs for one direction on one day.
  function computeDir(dayKey,dirKey,nowMin,feedCount,full){
    const d = CONFIG.directions[dirKey];
    const meta = { color:d.color, tint:d.tint||d.color, badge:d.badge, label:d.label, soft:hexToRgba(d.color,.12) };
    const bs = blocks(dayKey,dirKey);
    const times = expand(bs);
    if(!times.length) return { ...meta, hasAny:false, hasNext:false, noNext:true, statusText:'no service', last:'', next:null, following:[], feed:[] };

    const firstMin = times[0], lastMin = times[times.length-1];
    let phase = 'active';
    if(nowMin < firstMin) phase = 'before'; else if(nowMin > lastMin) phase = 'ended';

    let freqNow = null;
    for(const b of bs){ if(nowMin >= p2m(b.from) && nowMin < p2m(b.to)){ freqNow = b.every; break; } }

    const nextIdx = phase === 'ended' ? -1 : times.findIndex(t => t >= nowMin);
    const all = times.map((t,i) => {
      const isNext = i === nextIdx;
      const isPast = nextIdx === -1 ? true : i < nextIdx;
      const isSoon = nextIdx !== -1 && i > nextIdx && i <= nextIdx+3;
      return { time:m2t(t), rel:rel(t-nowMin), isNext, isPast, isSoon, st:depStyle(meta,{isNext,isPast,isSoon}) };
    });
    const next = nextIdx === -1 ? null : all[nextIdx];
    const following = nextIdx === -1 ? [] : all.slice(nextIdx+1, nextIdx+3);
    const feed = full ? all : all.filter(a => !a.isPast).slice(0, feedCount);
    const statusText = phase === 'ended' ? 'last shuttle departed'
      : phase === 'before' ? `first shuttle ${m2t(firstMin)}`
      : (freqNow ? `every ${freqNow} min right now` : 'in service');

    return { ...meta, hasAny:true, hasNext:!!next, noNext:!next, statusText, last:m2t(lastMin), next, following, feed };
  }

  // ---- app state -----------------------------------------------------------
  const state = { day:null, dayPinned:false, override:null, now:null, showFull: CONFIG.display.showFullSchedule ?? false };

  function computeView(){
    const now = state.now || tzNow();
    const nowMin = state.override == null ? now.min : state.override;
    const dayKey = state.day || CONFIG.days[0].key;
    const dayMeta = CONFIG.days.find(d => d.key === dayKey) || CONFIG.days[0];
    const live = state.override == null;
    const isLiveDate = CONFIG.days.some(d => d.iso === now.iso);
    const feedCount = CONFIG.display.feedCount ?? 10;
    const full = state.showFull;

    const A = {
      r2l: computeDir(dayKey,'r2l',nowMin,feedCount,full),
      l2r: computeDir(dayKey,'l2r',nowMin,feedCount,full),
    };

    // Slider spans the actual service window for the selected day.
    const union = [...expand(blocks(dayKey,'r2l')), ...expand(blocks(dayKey,'l2r'))];
    const lo = union.length ? Math.min(...union) : 7*60;
    const hi = union.length ? Math.max(...union) : 23*60+30;

    const clock = {
      shown: live ? `${pad(now.hour)}:${pad(now.minute)}` : m2t(nowMin),
      tag:   live ? (isLiveDate ? 'LIVE' : 'LIVE CLOCK') : 'SIM TIME',
      dotSt: `width:8px;height:8px;border-radius:50%;background:${live?'#38ffb0':'#ffcf3d'};box-shadow:0 0 10px ${live?'#38ffb0':'#ffcf3d'};animation:${live?'pulseDot 1.6s ease-in-out infinite':'none'};display:inline-block;`,
      tagSt: `font:700 10px 'Space Mono';padding:2px 9px;border-radius:999px;white-space:nowrap;color:${live?'#38ffb0':'#ffcf3d'};border:1px solid ${live?'rgba(56,255,176,.5)':'rgba(255,207,61,.5)'};background:${live?'rgba(56,255,176,.08)':'rgba(255,207,61,.08)'};`,
    };

    return {
      showSchematic: CONFIG.display.showSchematic ?? true,
      showSim:       CONFIG.display.showSimClock ?? false,
      showFull:      full,
      dayKey, dayLabel:dayMeta.label, dayDate:dayMeta.date,
      clock, min:lo, max:hi, sliderVal:nowMin, A,
    };
  }

  // ---- view (returns HTML strings; faithful port of the original design) ----
  const T = CONFIG.theme;

  function schematic(){
    const D = CONFIG.directions, b = CONFIG.branding;
    return `<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:13px;margin-bottom:15px;">
      <div style="font:600 13px 'Chakra Petch';letter-spacing:.08em;color:${T.text};">${b.left}</div>
      <div style="flex:1;position:relative;height:28px;">
        <div style="position:absolute;top:50%;left:6px;right:6px;height:2px;background:linear-gradient(90deg,${D.r2l.color},${D.l2r.color});opacity:.55;transform:translateY(-50%);"></div>
        <div style="position:absolute;top:0;left:0;right:8px;text-align:right;font:700 9px 'Space Mono';color:${D.r2l.color};">${D.r2l.badge} ▸</div>
        <div style="position:absolute;bottom:0;left:8px;right:0;text-align:left;font:700 9px 'Space Mono';color:${D.l2r.color};">▾ ${D.l2r.badge}</div>
        <div style="position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;background:${D.r2l.color};transform:translateY(-50%);box-shadow:0 0 10px ${D.r2l.color};"></div>
        <div style="position:absolute;top:50%;right:0;width:10px;height:10px;border-radius:50%;background:${D.l2r.color};transform:translateY(-50%);box-shadow:0 0 10px ${D.l2r.color};"></div>
      </div>
      <div style="font:600 13px 'Chakra Petch';letter-spacing:.08em;color:${T.text};">${b.right}</div>
    </div>`;
  }

  function dayTab(d,active){
    const acc = T.accent;
    const tabSt = active
      ? `flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 3px;border-radius:10px;cursor:pointer;border:1px solid ${hexToRgba(acc,.6)};background:linear-gradient(180deg,${hexToRgba(acc,.18)},${hexToRgba(acc,.03)});box-shadow:0 0 20px -7px ${hexToRgba(acc,.9)};`
      : `flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 3px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;`;
    return `<button onclick="APP.pick('${d.key}')" style="${tabSt}">
      <div style="font:700 15px 'Chakra Petch';color:${active?'#dffbff':'#c7c7dd'};line-height:1;">${d.label}</div>
      <div style="font:400 9px 'Space Mono';color:${active?acc:'#6a6a86'};margin-top:3px;letter-spacing:.06em;">${d.date}</div>
    </button>`;
  }

  function nextCard(dirKey,x,marginBottom){
    const c = x.color;
    const body = x.hasNext
      ? `<div style="display:flex;align-items:baseline;gap:12px;">
           <div style="font:700 46px 'Space Mono';color:#fff;line-height:1;text-shadow:0 0 26px ${hexToRgba(c,.7)};">${x.next.time}</div>
           <div style="font:600 15px 'Chakra Petch';color:${x.tint};">${x.next.rel}</div>
         </div>
         <div style="display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap;">
           <span style="font:700 9px 'Space Mono';color:#565673;letter-spacing:.1em;">THEN</span>
           ${x.following.map(f => `<span style="font:400 13px 'Space Mono';color:#c7c7dd;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 9px;">${f.time}</span>`).join('')}
         </div>`
      : `<div style="font:700 26px 'Space Mono';color:#4a4a63;">— last ${x.last || '—'}</div>`;
    return `<div style="border:1px solid ${hexToRgba(c,.35)};border-radius:16px;padding:15px;margin-bottom:${marginBottom};background:linear-gradient(180deg,${hexToRgba(c,.11)},${hexToRgba(c,.02)});box-shadow:0 0 36px -16px ${hexToRgba(c,.8)};">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;">
        <div style="display:flex;align-items:center;gap:9px;">
          <span style="font:700 11px 'Space Mono';color:${c};border:1px solid ${c};border-radius:999px;padding:2px 9px;">${x.badge}</span>
          <span style="font:600 14px 'Chakra Petch';color:${T.text};">${x.label}</span>
        </div>
        <span style="font:400 10px 'Space Mono';color:#9a9ab4;text-align:right;">${x.statusText}</span>
      </div>
      ${body}
    </div>`;
  }

  // Segmented-toggle button style (Upcoming | Full).
  function segSt(active){
    return `font:700 9px 'Space Mono';letter-spacing:.06em;padding:5px 10px;cursor:pointer;border:none;`
      + (active ? `color:#08080e;background:${T.accent};` : `color:#9a9ab4;background:transparent;`);
  }

  function feedCol(x){
    const c = x.color;
    const rows = x.feed.map(dep => `<div style="${dep.st}">
      <span style="display:flex;align-items:center;gap:7px;"><span>${dep.time}</span>${dep.isNext?`<span style="font:700 8px 'Space Mono';padding:1px 5px;border-radius:4px;background:#fff;color:#08080e;letter-spacing:.08em;">NEXT</span>`:''}</span>
      <span style="font:400 9px 'Space Mono';opacity:.7;">${dep.rel}</span>
    </div>`).join('');
    const empty = x.feed.length ? '' : `<div style="font:400 10px 'Space Mono';color:#565673;padding:8px 4px;">${x.hasAny ? 'no more today' : 'no service'}</div>`;
    return `<div>
      <div style="font:700 10px 'Space Mono';color:${c};letter-spacing:.08em;padding:0 4px 6px;border-bottom:1px solid ${hexToRgba(c,.25)};margin-bottom:7px;">${x.badge}</div>
      ${rows}${empty}
    </div>`;
  }

  function simPanel(v){
    return `<div style="margin-top:16px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.015);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;">
        <span style="font:700 10px 'Space Mono';letter-spacing:.08em;color:#6a6a86;">// preview_clock — time-travel <span style="color:#454560;">(showSimClock: false to hide)</span></span>
        <button onclick="APP.goLive()" style="font:700 9px 'Space Mono';letter-spacing:.05em;padding:4px 10px;border-radius:999px;cursor:pointer;color:#38ffb0;border:1px solid rgba(56,255,176,.5);background:rgba(56,255,176,.08);">◉ LIVE</button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font:700 18px 'Space Mono';color:${T.accent};min-width:60px;">${v.clock.shown}</span>
        <input type="range" min="${v.min}" max="${v.max}" value="${v.sliderVal}" onpointerdown="APP.scrubStart()" oninput="APP.scrub(this.value)" onpointerup="APP.scrubEnd()" onchange="APP.scrubEnd()" style="flex:1;">
        <span style="${v.clock.tagSt}">${v.clock.tag}</span>
      </div>
    </div>`;
  }

  function template(v){
    const b = CONFIG.branding;
    return `<div style="min-height:100vh;font-family:'Chakra Petch',system-ui,sans-serif;color:${T.text};background-color:${T.bg};background-image:radial-gradient(120% 60% at 50% -6%, ${hexToRgba(T.brand,.12)}, transparent 55%),radial-gradient(120% 60% at 50% 108%, ${hexToRgba(T.accent,.09)}, transparent 55%),linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);background-size:auto,auto,44px 44px,44px 44px;display:flex;justify-content:center;">
      <div style="width:100%;max-width:452px;padding:20px 16px 30px;">

        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <div>
            <div style="font:700 13px 'Space Mono';letter-spacing:.2em;color:${T.brand};text-shadow:0 0 16px ${hexToRgba(T.brand,.6)};">${b.title}</div>
            <div style="font:400 10px 'Space Mono';color:#565673;margin-top:3px;letter-spacing:.06em;">${b.subtitle}</div>
          </div>
          <div style="text-align:right;">
            <div style="display:flex;align-items:center;gap:7px;justify-content:flex-end;">
              <span style="${v.clock.dotSt}"></span>
              <span style="font:700 20px 'Space Mono';color:${T.text};">${v.clock.shown}</span>
            </div>
            <div style="font:700 9px 'Space Mono';color:#8a8aa4;margin-top:3px;letter-spacing:.1em;">${v.clock.tag} · ${v.dayLabel}</div>
          </div>
        </div>

        ${v.showSchematic ? schematic() : ''}

        <div style="display:flex;gap:6px;margin-bottom:16px;">
          ${CONFIG.days.map(d => dayTab(d, d.key === v.dayKey)).join('')}
        </div>

        ${nextCard('r2l', v.A.r2l, '11px')}
        ${nextCard('l2r', v.A.l2r, '18px')}

        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <div style="font:700 11px 'Space Mono';letter-spacing:.14em;color:#8a8aa4;">// ${v.showFull ? 'FULL' : 'UPCOMING'} — ${v.dayLabel} ${v.dayDate}</div>
          <div style="display:flex;border:1px solid rgba(255,255,255,.12);border-radius:7px;overflow:hidden;">
            <button onclick="APP.setFull(false)" style="${segSt(!v.showFull)}">UPCOMING</button>
            <button onclick="APP.setFull(true)" style="${segSt(v.showFull)}">FULL</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          ${feedCol(v.A.r2l)}
          ${feedCol(v.A.l2r)}
        </div>

        <div style="margin-top:20px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;">
          <span style="font:400 10px 'Space Mono';color:#565673;">shown in ${b.tzLabel} time · auto-refreshes</span>
          <span style="font:700 11px 'Space Mono';color:${T.accent};">&gt;<span style="animation:blink 1.1s step-end infinite;">_</span></span>
        </div>

        ${v.showSim ? simPanel(v) : ''}

      </div>
    </div>`;
  }

  // ---- controller ----------------------------------------------------------
  const APP = {
    scrubbing: false,
    pick(k){ state.day = k; state.dayPinned = true; paint(); },   // tapping a day pins it (stops live-day follow)
    setFull(b){ state.showFull = b; paint(); },
    goLive(){ state.override = null; paint(); },
    scrubStart(){ this.scrubbing = true; },                            // pause auto-ticks while dragging
    scrub(val){ state.override = +val; if(!this.scrubbing) paint(); }, // keyboard/click update live; drag defers to release
    scrubEnd(){ if(this.scrubbing){ this.scrubbing = false; paint(); } },
  };

  // Repaint only when the rendered output actually changes. The visible content
  // updates at most once a minute (clock is HH:MM, relative times are per-minute),
  // so this avoids replacing the DOM every second — no wasted work, and no chance
  // of a click landing on a tick that rebuilds the button out from under it.
  let lastHtml = '';
  function paint(){
    const html = template(computeView());
    if(html === lastHtml) return;
    lastHtml = html;
    document.getElementById('app').innerHTML = html;
  }

  function tick(){
    if(APP.scrubbing) return;                    // don't rebuild the slider mid-drag
    state.now = tzNow();
    if(!state.dayPinned){                        // follow the live day (today if it's an event day) until the user taps one
      const m = CONFIG.days.find(d => d.iso === state.now.iso);
      state.day = m ? m.key : CONFIG.days[0].key;
    }
    paint();
  }

  tick();
  setInterval(tick, 1000);
  </script>
</body>
</html>
