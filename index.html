document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fdiv>\n      <sc-if value=\"{{ A.r2l.hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;\">\n          <div style=\"font:700 46px 'Space Mono';color:#fff;line-height:1;text-shadow:0 0 26px rgba(255,47,134,.7);\">{{ A.r2l.next.time }}<\u002Fdiv>\n          <div style=\"font:600 15px 'Chakra Petch';color:#ff8fc0;\">{{ A.r2l.next.rel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap;\">\n          <span style=\"font:700 9px 'Space Mono';color:#565673;letter-spacing:.1em;\">THEN<\u002Fspan>\n          <sc-for list=\"{{ A.r2l.following }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <span style=\"font:400 13px 'Space Mono';color:#c7c7dd;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 9px;\">{{ f.time }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ A.r2l.noNext }}\">\n        <div style=\"font:700 26px 'Space Mono';color:#4a4a63;\">— last {{ A.r2l.last }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- NEXT card: L->R -->\n    <div style=\"border:1px solid rgba(37,230,255,.35);border-radius:16px;padding:15px;margin-bottom:18px;background:linear-gradient(180deg,rgba(37,230,255,.10),rgba(37,230,255,.02));box-shadow:0 0 36px -16px rgba(37,230,255,.8);\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;\">\n        <div style=\"display:flex;align-items:center;gap:9px;\">\n          <span style=\"font:700 11px 'Space Mono';color:#25e6ff;border:1px solid #25e6ff;border-radius:999px;padding:2px 9px;\">L→R<\u002Fspan>\n          <span style=\"font:600 14px 'Chakra Petch';color:#e9e9f5;\">LVCC → Rio<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font:400 10px 'Space Mono';color:#9a9ab4;text-align:right;\">{{ A.l2r.statusText }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ A.l2r.hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;\">\n          <div style=\"font:700 46px 'Space Mono';color:#fff;line-height:1;text-shadow:0 0 26px rgba(37,230,255,.7);\">{{ A.l2r.next.time }}<\u002Fdiv>\n          <div style=\"font:600 15px 'Chakra Petch';color:#8fe9ff;\">{{ A.l2r.next.rel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap;\">\n          <span style=\"font:700 9px 'Space Mono';color:#565673;letter-spacing:.1em;\">THEN<\u002Fspan>\n          <sc-for list=\"{{ A.l2r.following }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <span style=\"font:400 13px 'Space Mono';color:#c7c7dd;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 9px;\">{{ f.time }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ A.l2r.noNext }}\">\n        <div style=\"font:700 26px 'Space Mono';color:#4a4a63;\">— last {{ A.l2r.last }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- upcoming board -->\n    <div style=\"font:700 11px 'Space Mono';letter-spacing:.14em;color:#8a8aa4;margin-bottom:10px;\">// UPCOMING — {{ dayLabel }} {{ dayDate }}<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n      <div>\n        <div style=\"font:700 10px 'Space Mono';color:#ff2f86;letter-spacing:.08em;padding:0 4px 6px;border-bottom:1px solid rgba(255,47,134,.25);margin-bottom:7px;\">R→L<\u002Fdiv>\n        <sc-for list=\"{{ A.r2l.feed }}\" as=\"dep\" hint-placeholder-count=\"6\">\n          <div style=\"{{ dep.st }}\">\n            <span style=\"display:flex;align-items:center;gap:7px;\"><span>{{ dep.time }}<\u002Fspan><sc-if value=\"{{ dep.isNext }}\"><span style=\"font:700 8px 'Space Mono';padding:1px 5px;border-radius:4px;background:#fff;color:#08080e;letter-spacing:.08em;\">NEXT<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <span style=\"font:400 9px 'Space Mono';opacity:.7;\">{{ dep.rel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ A.r2l.noNext }}\"><div style=\"font:400 10px 'Space Mono';color:#565673;padding:8px 4px;\">no more today<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:700 10px 'Space Mono';color:#25e6ff;letter-spacing:.08em;padding:0 4px 6px;border-bottom:1px solid rgba(37,230,255,.25);margin-bottom:7px;\">L→R<\u002Fdiv>\n        <sc-for list=\"{{ A.l2r.feed }}\" as=\"dep\" hint-placeholder-count=\"6\">\n          <div style=\"{{ dep.st }}\">\n            <span style=\"display:flex;align-items:center;gap:7px;\"><span>{{ dep.time }}<\u002Fspan><sc-if value=\"{{ dep.isNext }}\"><span style=\"font:700 8px 'Space Mono';padding:1px 5px;border-radius:4px;background:#fff;color:#08080e;letter-spacing:.08em;\">NEXT<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <span style=\"font:400 9px 'Space Mono';opacity:.7;\">{{ dep.rel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ A.l2r.noNext }}\"><div style=\"font:400 10px 'Space Mono';color:#565673;padding:8px 4px;\">no more today<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- footer -->\n    <div style=\"margin-top:20px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;\">\n      <span style=\"font:400 10px 'Space Mono';color:#565673;\">shown in Las Vegas time · auto-refreshes<\u002Fspan>\n      <span style=\"font:700 11px 'Space Mono';color:#25e6ff;\">&gt;<span style=\"animation:blink 1.1s step-end infinite;\">_<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- preview clock (hide for publish via the showSimControl tweak) -->\n    <sc-if value=\"{{ showSim }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:16px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.015);\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;\">\n        <span style=\"font:700 10px 'Space Mono';letter-spacing:.08em;color:#6a6a86;\">// preview_clock — time-travel <span style=\"color:#454560;\">(hide before publish)<\u002Fspan><\u002Fspan>\n        <button sc-camel-on-click=\"{{ goLive }}\" style=\"font:700 9px 'Space Mono';letter-spacing:.05em;padding:4px 10px;border-radius:999px;cursor:pointer;color:#38ffb0;border:1px solid rgba(56,255,176,.5);background:rgba(56,255,176,.08);\">◉ LIVE<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <span style=\"font:700 18px 'Space Mono';color:#25e6ff;min-width:60px;\">{{ clock.shown }}<\u002Fspan>\n        <input type=\"range\" min=\"{{ min }}\" max=\"{{ max }}\" value=\"{{ sliderVal }}\" sc-camel-on-change=\"{{ setOverride }}\" style=\"flex:1;\">\n        <span style=\"{{ clock.tagSt }}\">{{ clock.tag }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSimControl&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Preview&quot;},&quot;showSchematic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;feedCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:4,&quot;max&quot;:24,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Display&quot;,&quot;unit&quot;:&quot;rows&quot;}}\">\nconst TZ = 'America/Los_Angeles';\nconst MON = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};\nconst pad = n => String(n).padStart(2,'0');\nconst p2m = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };\nconst m2t = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;\n\n// ---- EDIT HERE: event days (Las Vegas dates) ----\nconst DAYS = [\n  {key:'thu', label:'THU', date:'AUG 6', iso:'2026-08-06'},\n  {key:'fri', label:'FRI', date:'AUG 7', iso:'2026-08-07'},\n  {key:'sat', label:'SAT', date:'AUG 8', iso:'2026-08-08'},\n  {key:'sun', label:'SUN', date:'AUG 9', iso:'2026-08-09'},\n];\n\n// ---- EDIT HERE: frequency blocks. every = minutes between departures. phase shifts start time. ----\nconst B = (from,to,every,phase=0) => ({from,to,every,phase});\nconst SCHED = {\n  thu:{ r2l:[B('07:00','10:00',30),B('10:00','18:00',20),B('18:00','23:30',30)],\n        l2r:[B('07:00','10:00',30,6),B('10:00','18:00',20,6),B('18:00','23:30',30,6)] },\n  fri:{ r2l:[B('07:00','09:00',20),B('09:00','19:00',12),B('19:00','23:30',20)],\n        l2r:[B('07:00','09:00',20,6),B('09:00','19:00',12,6),B('19:00','23:30',20,6)] },\n  sat:{ r2l:[B('07:00','09:00',20),B('09:00','19:00',10),B('19:00','23:30',20)],\n        l2r:[B('07:00','09:00',20,5),B('09:00','19:00',10,5),B('19:00','23:30',20,5)] },\n  sun:{ r2l:[B('07:00','10:00',20),B('10:00','15:00',15),B('15:00','20:00',30)],\n        l2r:[B('07:00','10:00',20,6),B('10:00','15:00',15,6),B('15:00','20:00',30,6)] },\n};\n\nconst DIRS = {\n  r2l:{ key:'r2l', color:'#ff2f86', glow:'rgba(255,47,134,.55)', soft:'rgba(255,47,134,.12)' },\n  l2r:{ key:'l2r', color:'#25e6ff', glow:'rgba(37,230,255,.55)', soft:'rgba(37,230,255,.12)' },\n};\n\nclass Component extends DCLogic {\n  state = { day:null, override:null, now:null, tick:0 };\n\n  componentDidMount(){ this.sync(); this._iv = setInterval(()=>this.sync(), 1000); }\n  componentWillUnmount(){ clearInterval(this._iv); }\n\n  sync(){\n    const now = this.lvNow();\n    let day = this.state.day;\n    if(!day){ const m = DAYS.find(d=>d.iso===now.iso); day = m ? m.key : DAYS[0].key; }\n    this.setState({ now, day, tick:this.state.tick+1 });\n  }\n\n  lvNow(){\n    const parts = new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,weekday:'short',month:'short',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date());\n    const g = t => { const p = parts.find(x=>x.type===t); return p ? p.value : ''; };\n    const hour = (+g('hour'))%24, minute = +g('minute');\n    return { hour, minute, iso:`${g('year')}-${MON[g('month')]||'01'}-${g('day')}`, min:hour*60+minute };\n  }\n\n  expand(blocks){\n    const out = [];\n    blocks.forEach(b=>{ const s = p2m(b.from)+(b.phase||0), e = p2m(b.to); for(let t=s;t<e;t+=b.every) out.push(t); });\n    return out.sort((a,b)=>a-b);\n  }\n\n  rel(diff){\n    if(diff===0) return 'boarding';\n    if(diff<0) return 'departed';\n    if(diff<60) return `in ${diff} min`;\n    return `in ${Math.floor(diff/60)}h ${pad(diff%60)}m`;\n  }\n\n  depStyle(meta,{isNext,isPast,isSoon}){\n    const base = { display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 9px', borderRadius:'8px', marginBottom:'3px', font:\"700 14px 'Space Mono'\" };\n    if(isNext) return { ...base, color:'#fff', background:`linear-gradient(90deg, ${meta.soft}, transparent)`, borderLeft:`3px solid ${meta.color}`, boxShadow:`inset 0 0 0 1px ${meta.soft}` };\n    if(isPast) return { ...base, color:'#42425c', borderLeft:'3px solid transparent' };\n    if(isSoon) return { ...base, color:'#e9e9f5', borderLeft:`3px solid ${meta.color}` };\n    return { ...base, color:'#9a9ab4', borderLeft:'3px solid transparent' };\n  }\n\n  computeDir(dayKey, dirKey, nowMin, feedCount){\n    const meta = DIRS[dirKey];\n    const times = this.expand(SCHED[dayKey][dirKey]);\n    const firstMin = times[0], lastMin = times[times.length-1];\n    let state = 'active';\n    if(nowMin < firstMin) state = 'before'; else if(nowMin > lastMin) state = 'ended';\n    let freqNow = null;\n    for(const b of SCHED[dayKey][dirKey]){ if(nowMin>=p2m(b.from) && nowMin<p2m(b.to)){ freqNow = b.every; break; } }\n    const nextIdx = state==='ended' ? -1 : times.findIndex(t=>t>=nowMin);\n    const all = times.map((t,i)=>{\n      const isNext = i===nextIdx;\n      const isPast = nextIdx===-1 ? true : i<nextIdx;\n      const isSoon = nextIdx!==-1 && i>nextIdx && i<=nextIdx+3;\n      return { min:t, time:m2t(t), rel:this.rel(t-nowMin), isNext, isPast, isSoon, st:this.depStyle(meta,{isNext,isPast,isSoon}) };\n    });\n    const next = nextIdx===-1 ? null : all[nextIdx];\n    const following = nextIdx===-1 ? [] : all.slice(nextIdx+1, nextIdx+3);\n    const future = all.filter(a=>!a.isPast);\n    const statusText = state==='ended' ? 'last shuttle departed'\n      : state==='before' ? `first shuttle ${m2t(firstMin)}`\n      : (freqNow ? `every ${freqNow} min right now` : 'in service');\n    return { ...meta, state, hasNext:!!next, noNext:!next, statusText, first:m2t(firstMin), last:m2t(lastMin), next, following, feed:future.slice(0, feedCount) };\n  }\n\n  renderVals(){\n    const now = this.state.now || this.lvNow();\n    const realMin = now.min;\n    const nowMin = this.state.override==null ? realMin : this.state.override;\n    const day = this.state.day || DAYS[0].key;\n    const dayMeta = DAYS.find(d=>d.key===day);\n    const live = this.state.override==null;\n    const isLiveDate = DAYS.some(d=>d.iso===now.iso);\n\n    const feedCount = this.props.feedCount ?? 10;\n    const showSim = this.props.showSimControl ?? true;\n    const showSchematic = this.props.showSchematic ?? true;\n\n    const data = {\n      r2l:this.computeDir(day,'r2l',nowMin,feedCount),\n      l2r:this.computeDir(day,'l2r',nowMin,feedCount),\n    };\n\n    const days = DAYS.map(d=>{\n      const active = d.key===day;\n      return {\n        ...d, active,\n        onPick:()=>this.setState({day:d.key}),\n        tabSt: active\n          ? { flex:1, display:'flex', flexDirection:'column', alignItems:'center', padding:'8px 3px', borderRadius:'10px', cursor:'pointer', border:'1px solid rgba(37,230,255,.6)', background:'linear-gradient(180deg,rgba(37,230,255,.18),rgba(37,230,255,.03))', boxShadow:'0 0 20px -7px rgba(37,230,255,.9)' }\n          : { flex:1, display:'flex', flexDirection:'column', alignItems:'center', padding:'8px 3px', borderRadius:'10px', cursor:'pointer', border:'1px solid rgba(255,255,255,.1)', background:'transparent' },\n        labSt: { font:\"700 15px 'Chakra Petch'\", color: active?'#dffbff':'#c7c7dd', lineHeight:1 },\n        dateSt:{ font:\"400 9px 'Space Mono'\", color: active?'#25e6ff':'#6a6a86', marginTop:'3px', letterSpacing:'.06em' },\n      };\n    });\n\n    const clock = {\n      shown: live ? `${pad(now.hour)}:${pad(now.minute)}` : m2t(nowMin),\n      tag: live ? (isLiveDate ? 'LIVE' : 'LIVE CLOCK') : 'SIM TIME',\n      dotSt: { width:'8px', height:'8px', borderRadius:'50%', background: live?'#38ffb0':'#ffcf3d', boxShadow:`0 0 10px ${live?'#38ffb0':'#ffcf3d'}`, animation: live?'pulseDot 1.6s ease-in-out infinite':'none', display:'inline-block' },\n      tagSt: { font:\"700 10px 'Space Mono'\", padding:'2px 9px', borderRadius:'999px', whiteSpace:'nowrap', color: live?'#38ffb0':'#ffcf3d', border:`1px solid ${live?'rgba(56,255,176,.5)':'rgba(255,207,61,.5)'}`, background: live?'rgba(56,255,176,.08)':'rgba(255,207,61,.08)' },\n    };\n\n    return {\n      showSim, showSchematic,\n      days, dayLabel: dayMeta?dayMeta.label:'', dayDate: dayMeta?dayMeta.date:'',\n      clock,\n      min: 7*60, max: 23*60+30, sliderVal: nowMin,\n      setOverride: e => this.setState({ override: +e.target.value }),\n      goLive: () => this.setState({ override: null }),\n      A: data,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
