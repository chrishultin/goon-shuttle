<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Social preview image source (Open Graph / Twitter card). Renders at 1200x630.
  This is the source for ../og-image.png. Edit the text/colors here if you
  rebrand, then regenerate the PNG from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=og-image.png "file://$PWD/tools/og-image.html"
    sips -z 630 1200 og-image.png    # downscale the 2x capture to 1200x630
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:'Chakra Petch',system-ui,sans-serif;color:#e9e9f5;
    background-color:#08080e;
    background-image:
      radial-gradient(120% 60% at 50% -6%, rgba(255,47,134,.16), transparent 55%),
      radial-gradient(120% 60% at 50% 108%, rgba(37,230,255,.13), transparent 55%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:auto,auto,52px 52px,52px 52px;
    padding:60px 72px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .mono{font-family:'Space Mono',monospace;}
  .end{font-weight:600;font-size:32px;letter-spacing:.08em;}
  .card{border-radius:22px;padding:26px 30px;}
  .badge{font-weight:700;font-size:18px;border-radius:999px;padding:4px 15px;}
  .time{font-weight:700;font-size:78px;line-height:1;color:#fff;}
</style>
</head>
<body>

  <div>
    <div class="mono" style="font-weight:700;font-size:56px;letter-spacing:.13em;color:#ff2f86;text-shadow:0 0 30px rgba(255,47,134,.6);">DEF CON // SHUTTLE</div>
    <div class="mono" style="font-size:23px;letter-spacing:.12em;color:#7a7a97;margin-top:15px;">RIO ⇄ LVCC · LAS VEGAS · PT</div>
  </div>

  <div style="display:flex;align-items:center;gap:24px;">
    <div class="end">RIO</div>
    <div style="flex:1;position:relative;height:46px;">
      <div style="position:absolute;top:50%;left:12px;right:12px;height:3px;background:linear-gradient(90deg,#ff2f86,#25e6ff);opacity:.6;transform:translateY(-50%);"></div>
      <div class="mono" style="position:absolute;top:0;right:14px;font-weight:700;font-size:16px;color:#ff2f86;">R→L ▸</div>
      <div class="mono" style="position:absolute;bottom:0;left:14px;font-weight:700;font-size:16px;color:#25e6ff;">▾ L→R</div>
      <div style="position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:#ff2f86;transform:translateY(-50%);box-shadow:0 0 18px #ff2f86;"></div>
      <div style="position:absolute;top:50%;right:0;width:18px;height:18px;border-radius:50%;background:#25e6ff;transform:translateY(-50%);box-shadow:0 0 18px #25e6ff;"></div>
    </div>
    <div class="end">LVCC</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;">
    <div class="card" style="border:1px solid rgba(255,47,134,.35);background:linear-gradient(180deg,rgba(255,47,134,.12),rgba(255,47,134,.02));box-shadow:0 0 60px -24px rgba(255,47,134,.9);">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
        <span class="mono badge" style="color:#ff2f86;border:1px solid #ff2f86;">R→L</span>
        <span style="font-weight:600;font-size:25px;">Rio → LVCC</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:18px;">
        <span class="mono time" style="text-shadow:0 0 40px rgba(255,47,134,.7);">17:20</span>
        <span style="font-weight:600;font-size:27px;color:#ff8fc0;">in 4 min</span>
      </div>
      <div class="mono" style="margin-top:16px;font-size:17px;color:#9a9ab4;">every 20 min · then 17:40 · 18:00</div>
    </div>
    <div class="card" style="border:1px solid rgba(37,230,255,.35);background:linear-gradient(180deg,rgba(37,230,255,.11),rgba(37,230,255,.02));box-shadow:0 0 60px -24px rgba(37,230,255,.9);">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
        <span class="mono badge" style="color:#25e6ff;border:1px solid #25e6ff;">L→R</span>
        <span style="font-weight:600;font-size:25px;">LVCC → Rio</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:18px;">
        <span class="mono time" style="text-shadow:0 0 40px rgba(37,230,255,.7);">17:26</span>
        <span style="font-weight:600;font-size:27px;color:#8fe9ff;">in 10 min</span>
      </div>
      <div class="mono" style="margin-top:16px;font-size:17px;color:#9a9ab4;">every 20 min · then 17:46 · 18:06</div>
    </div>
  </div>

  <div class="mono" style="display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#565673;">
    <span>live board · next departures shown in Las Vegas time</span>
    <span style="color:#25e6ff;font-weight:700;">socgoons.github.io/goon-shuttle &gt;_</span>
  </div>

</body>
</html>
