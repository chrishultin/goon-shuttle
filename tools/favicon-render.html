<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Sizing wrapper so headless Chrome rasterizes ../favicon.svg filling the whole
  frame (the raw viewBox-only SVG would otherwise render at its intrinsic 100px).
  Render at the largest size you need, then downscale with sips. See README.
-->
<style>html,body{margin:0;background:#08080e}img{display:block;width:100vw;height:100vh}</style>
</head>
<body><img src="../favicon.svg" alt=""></body>
</html>
